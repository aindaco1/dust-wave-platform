name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      matrix:
        fluidaudio: ['0.15.5', '0.15.6', '0.15.7']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Characterize each consumer's FluidAudio version
        env:
          FLUIDAUDIO_VERSION: ${{ matrix.fluidaudio }}
        run: |
          bash scripts/test-native-version.sh "$FLUIDAUDIO_VERSION"

  test:
    strategy:
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run security gates and tests
        run: npm run check

  jekyll-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.2'
      - name: Build a new Jekyll consumer from pinned sources
        run: npm run test:recipes:jekyll

  desktop:
    runs-on: xcode-27
    timeout-minutes: 10
    strategy:
      matrix:
        sparkle: ['2.9.5', '2.9.6', '2.10.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Characterize desktop updates and reviewed diagnostics
        env:
          SPARKLE_VERSION: ${{ matrix.sparkle }}
        run: bash scripts/test-desktop-version.sh "$SPARKLE_VERSION"
      - name: Test display fixture lifecycle
        run: python3 -m unittest discover -s tools/macos-display -p 'test_*.py'
      - name: Test shared Apple support
        run: swift test --package-path support
      - name: Build support for the iOS 17 simulator minimum
        run: >-
          xcodebuild -scheme DustWaveSupport -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/support-ios" IPHONEOS_DEPLOYMENT_TARGET=17.0
          CODE_SIGNING_ALLOWED=NO build
        working-directory: support
